spring.application.name=mini-prj
server.port=8111

# 비밀 값은 프로젝트 루트의 .env 에서 읽습니다. (.env 는 .gitignore 에 등록, .env.example 참고)
# .env 값에는 따옴표를 쓰지 않습니다. 이 파일의 주석은 항상 별도 줄에 씁니다.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]


spring.datasource.url=jdbc:mysql://localhost:3306/mini_ai_prj?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

jwt.secret=${JWT_SECRET}
jwt.access-exp-ms=1800000
jwt.refresh-exp-ms=604800000

kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=http://localhost:3000/oauth/kakao

